name: Weekly rebuild

# Triggers a fresh Vercel build, which re-fetches step-tagged posts from
# first164.blogspot.com. Also runnable by hand from the Actions tab.
on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        run: curl -fsS -X POST "$DEPLOY_HOOK" > /dev/null && echo "rebuild triggered"
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}

      # GitHub disables scheduled workflows after 60 days without commits.
      # Push an empty commit when the last one is older than 45 days.
      - uses: actions/checkout@v4
      - name: Keep repository active
        run: |
          last=$(git log -1 --format=%ct)
          age=$(( ($(date +%s) - last) / 86400 ))
          echo "last commit ${age}d ago"
          if [ "$age" -lt 45 ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep scheduled workflow active"
          git push
